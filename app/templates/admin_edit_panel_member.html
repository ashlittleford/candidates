{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header">
                <h3>Edit Panel Member: {{ member.name }} {% if member.is_archived %}<span class="badge bg-secondary ms-2 fs-6">Archived</span>{% endif %}</h3>
            </div>
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" name="name" value="{{ member.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" name="username" value="{{ member.username }}" disabled>
                        <div class="form-text">Username cannot be changed.</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Assign to Formation Panel</label>
                        <select class="form-select" name="formation_panel_id">
                            <option value="">Select Panel...</option>
                            {% for panel in panels %}
                                <option value="{{ panel.id }}" {% if member.formation_panel_id == panel.id %}selected{% endif %}>
                                    Panel {{ panel.id }} (Chair: {{ panel.chair_name }})
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a href="{{ url_for('main.admin_dashboard') }}#members" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn uca-btn-red">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
