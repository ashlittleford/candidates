{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header">
                <h3>Global Settings</h3>
            </div>
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label class="form-label">Upcoming Dates of Formation Days</label>
                        <textarea class="form-control" name="upcoming_formation_dates" rows="5">{{ settings.upcoming_formation_dates }}</textarea>
                        <div class="form-text">These dates will apply to all candidates. Separate with commas.</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Formation Panels Dates (Yearly)</label>
                        <textarea class="form-control" name="formation_panel_dates" rows="3">{{ settings.formation_panel_dates }}</textarea>
                        <div class="form-text">Enter the dates for the 3 formation panels for the year. Format: "Label: Date, Label: Date".</div>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a href="{{ url_for('main.admin_dashboard') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn uca-btn-red">Save Settings</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
