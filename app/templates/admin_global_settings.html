{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header">
                <h3>Global Settings</h3>
            </div>
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label class="form-label">Upcoming Dates of Formation Days</label>
                        <input type="text" class="form-control" name="upcoming_formation_dates" value="{{ settings.upcoming_formation_dates }}">
                        <div class="form-text">These dates will apply to all candidates.</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Formation Panels Dates (Yearly)</label>
                        <input type="text" class="form-control" name="formation_panel_dates" value="{{ settings.formation_panel_dates }}">
                        <div class="form-text">Enter the dates for the 3 formation panels for the year. Applies to all candidates.</div>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a href="{{ url_for('main.admin_dashboard') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn uca-btn-red">Save Settings</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
