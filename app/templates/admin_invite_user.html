{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-white">
                <h4 class="mb-0">Invite {{ role }}</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>

                    <div class="mb-3">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>

                    {% if role == 'Panel Member' %}
                    <div class="mb-3">
                        <label for="formation_panel_id" class="form-label">Assign to Formation Panel</label>
                        <select class="form-select" id="formation_panel_id" name="formation_panel_id">
                            <option value="">Select a Panel...</option>
                            {% for panel in panels %}
                                <option value="{{ panel.id }}">Panel {{ panel.id }}: {{ panel.chair_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    {% endif %}

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('main.admin_dashboard') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn uca-btn-red">Send Invitation</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
