{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header uca-bg-red text-white">
                <h3 class="mb-0">Submit Document</h3>
            </div>
            <div class="card-body">
                <p class="text-muted mb-4">
                    Use this form to submit documents for a candidate without logging in.
                </p>

                <form method="POST" enctype="multipart/form-data">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <!-- Candidate Selection -->
                    <div class="mb-3">
                        <label for="user_id" class="form-label fw-bold">Select Candidate</label>
                        <select name="user_id" id="user_id" class="form-select" required>
                            <option value="">-- Select Candidate --</option>
                            {% for user in users %}
                                <option value="{{ user.id }}">{{ user.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Submission Type Selection -->
                    <div class="mb-3">
                        <label for="submission_type" class="form-label fw-bold">Submission Type</label>
                        <select name="submission_type" id="submission_type" class="form-select" required onchange="updateSubmissionType()">
                            <option value="">-- Select Type --</option>
                            <option value="formation_panel_paper">Formation Panel Paper</option>
                            <option value="panel_report">Panel Report</option>
                        </select>
                    </div>

                    <!-- Document Category Selection -->
                    <div class="mb-3">
                        <label for="category" class="form-label fw-bold">Document Category</label>
                        <select name="category" id="category" class="form-select" required>
                            <option value="">-- Select Submission Type First --</option>
                        </select>
                    </div>

                    <!-- Formation Day Selection (Formation Panel Paper only) -->
                    <div class="mb-3" id="dayLabelGroup" style="display: none;">
                        <label for="day_label" class="form-label fw-bold">Formation Day</label>
                        <select name="day_label" id="day_label" class="form-select">
                            <option value="">-- Select Formation Day --</option>
                            {% for year, dates in (formation_panel_dates_by_year or {}).items() %}
                                <optgroup label="{{ year }}">
                                    {% for date_str in dates %}
                                        <option value="{{ date_str }}">{{ date_str }}</option>
                                    {% endfor %}
                                </optgroup>
                            {% endfor %}
                        </select>
                        <div class="form-text text-muted">Optional — link this document to a specific formation panel day.</div>
                    </div>

                    <!-- File Upload -->
                    <div class="mb-4">
                        <label for="file" class="form-label fw-bold">Select File(s)</label>
                        <input type="file" name="file" id="file" class="form-control" multiple required>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn uca-btn-red btn-lg">Submit Document</button>
                        <a href="{{ url_for('main.login') }}" class="btn btn-outline-secondary">Back to Login</a>
                    </div>
                </form>

                <script>
                    const FORMATION_PANEL_PAPER_CATEGORIES = {{ candidate_categories | tojson }};
                    const PANEL_REPORT_CATEGORIES = {{ panel_categories | tojson }};

                    function updateSubmissionType() {
                        const type = document.getElementById('submission_type').value;
                        const categorySelect = document.getElementById('category');
                        const dayLabelGroup = document.getElementById('dayLabelGroup');
                        const daySelect = document.getElementById('day_label');

                        let categories = [];
                        if (type === 'formation_panel_paper') {
                            categories = FORMATION_PANEL_PAPER_CATEGORIES;
                            dayLabelGroup.style.display = '';
                        } else if (type === 'panel_report') {
                            categories = PANEL_REPORT_CATEGORIES;
                            dayLabelGroup.style.display = 'none';
                            daySelect.value = '';
                        } else {
                            dayLabelGroup.style.display = 'none';
                            daySelect.value = '';
                        }

                        categorySelect.innerHTML = '';
                        const placeholder = document.createElement('option');
                        placeholder.value = '';
                        placeholder.textContent = categories.length ? '-- Select Category --' : '-- Select Submission Type First --';
                        categorySelect.appendChild(placeholder);
                        categories.forEach(function(cat) {
                            const opt = document.createElement('option');
                            opt.value = cat;
                            opt.textContent = cat;
                            categorySelect.appendChild(opt);
                        });
                    }
                </script>
            </div>
        </div>
    </div>
</div>
{% endblock %}
