{% extends "base.html" %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <h1 class="mb-3">Manage Academic Requirements</h1>
        <a href="{{ url_for('main.admin_dashboard') }}" class="btn btn-outline-secondary mb-3">&larr; Back to Dashboard</a>
        <a href="{{ url_for('main.create_academic_requirement') }}" class="btn uca-btn-red mb-3 ms-2">
            <i class="fas fa-plus"></i> Add Requirement
        </a>
    </div>
</div>

<div class="card border-0 shadow-sm">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="bg-light">
                    <tr>
                        <th style="width: 5%;">Order</th>
                        <th style="width: 70%;">Name</th>
                        <th style="width: 25%;">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for requirement in requirements %}
                    <tr>
                        <td class="fw-bold">{{ requirement.sort_order }}</td>
                        <td>{{ requirement.name }}</td>
                        <td>
                            <a href="{{ url_for('main.edit_academic_requirement', requirement_id=requirement.id) }}" class="btn btn-sm btn-outline-primary">
                                <i class="fas fa-edit"></i> Edit
                            </a>
                            <form action="{{ url_for('main.delete_academic_requirement', requirement_id=requirement.id) }}" method="POST" class="d-inline" onsubmit="return confirm('Delete this requirement? This also removes every candidate\'s status for it.');">
                                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                            </form>
                        </td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="3" class="text-muted text-center">No academic requirements yet.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
